name: Preview TMD Mobile V4 on separate staging Worker

on:
  push:
    branches: [staging/mobile-v4-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmd-mobile-v4-preview
  cancel-in-progress: false

jobs:
  preview:
    # Initial setup commit is preparation only. A gated trigger commit
    # [deploy-mobile-v4-staging] deploys after Core staging has passed.
    if: github.ref == 'refs/heads/staging/mobile-v4-preview' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-mobile-v4-staging]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Require Cloudflare token for isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN for TMD Mobile preview. Set in staging environment or repository secrets; never paste it into issue comments."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Validate API contract and TypeScript
        run: |
          npm run check
          npm test
          node --check scripts/smoke-preview-app.mjs
      - name: Check the staging Worker cannot route production traffic
        run: |
          test "$(grep '^name' wrangler.staging.toml)" = 'name = "tmd-mobile-v4-staging"'
          grep -q '^workers_dev = true$' wrangler.staging.toml
          if grep -Eq '^(routes?|zone_id|custom_domain)[[:space:]]*=' wrangler.staging.toml; then
            echo '::error::Staging configuration must not include production routes.'
            exit 1
          fi
      - name: Verify staging Core V4 publicly readable and CORS-accessible from production client origin
        run: |
          node scripts/smoke-public-api.mjs \
            --origin=https://staging.tangomarathons.com \
            --client-origin=https://mobile.tangomarathons.com
      - name: Build V4 frontend with staging API only
        env:
          PUBLIC_TMD_USE_V4: 'true'
          PUBLIC_TMD_API_BASE_URL: 'https://staging.tangomarathons.com/wp-json/tmd/v3'
          PUBLIC_TMD_V4_API_BASE_URL: 'https://staging.tangomarathons.com/wp-json/tmd/v4'
        run: npm run build
      - name: Deploy preview Worker and capture isolated URL
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.staging.toml \
            --message "V4 staging preview ${GITHUB_SHA}" 2>&1 | tee wrangler-deploy.log

          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo '::error::Could not detect a workers.dev preview URL from Wrangler output. Run smoke-v4-preview-app.yml manually with the deployed URL if deployment succeeded.'
            exit 1
          fi
          if echo "$preview_url" | grep -q 'mobile\.tangomarathons\.com'; then
            echo '::error::Refusing to treat the production mobile domain as a staging preview.'
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Detected preview URL: $preview_url"
      - name: Smoke deployed preview Worker from its real browser origin
        run: |
          npm run smoke:preview -- \
            --url='${{ steps.deploy.outputs.preview_url }}' \
            --api-origin=https://staging.tangomarathons.com
