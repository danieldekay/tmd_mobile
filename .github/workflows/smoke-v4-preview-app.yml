name: Smoke deployed TMD Mobile V4 preview app

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Isolated deployed preview origin, e.g. https://tmd-mobile-v4-staging.<account>.workers.dev'
        required: true
        type: string
      api_origin:
        description: 'Core staging origin used by the preview'
        required: false
        default: 'https://staging.tangomarathons.com'
        type: string

permissions:
  contents: read

jobs:
  smoke-preview-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate preview smoke script syntax
        run: node --check scripts/smoke-preview-app.mjs
      - name: Smoke deployed preview shell, PWA assets and staging API reachability
        run: |
          npm run smoke:preview -- \
            --url='${{ inputs.preview_url }}' \
            --api-origin='${{ inputs.api_origin }}'
