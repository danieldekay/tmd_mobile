name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Manual runs on PR branches must not deploy to the production domain.
    if: github.ref == 'refs/heads/main'
    name: Deploy Worker Assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck and validate routes
        run: npm run check

      - name: API and public-cache regression tests
        run: npm test

      - name: Build (V3 production default)
        env:
          # Intentional hard stop: enable V4 only in a separate gated rollout.
          PUBLIC_TMD_USE_V4: 'false'
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --message "GitHub Actions deploy ${GITHUB_SHA}"
